plugins {
    id 'fabric-loom' version '1.17.13'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url = "https://maven.fabricmc.net/"
        content {
            includeModule("net.fabricmc", "intermediary")
        }
        metadataSources {
            artifact()
        }
    }
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        simplesync {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Minecraft and Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings files("gradle/identity-mappings-${project.minecraft_version}.jar")
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation('org.apache.commons:commons-compress:1.28.0') {
        transitive = false
    }
    shadowBundle('org.apache.commons:commons-compress:1.28.0') {
        transitive = false
    }

    implementation('commons-io:commons-io:2.18.0') {
        transitive = false
    }
    shadowBundle('commons-io:commons-io:2.18.0') {
        transitive = false
    }

    implementation 'com.github.luben:zstd-jni:1.5.6-8'
    shadowBundle 'com.github.luben:zstd-jni:1.5.6-8'

    // Gson is provided by Minecraft at runtime, but needed for detached StandaloneUploader process
    implementation 'com.google.code.gson:gson:2.11.0'
    shadowBundle 'com.google.code.gson:gson:2.11.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    modApi "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

test {
    useJUnitPlatform()
}

shadowJar {
    from sourceSets.client.output
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'shadow-dev'

    relocate 'org.apache.commons.compress', 'dev.simplesync.shadow.org.apache.commons.compress'
    relocate 'org.apache.commons.io', 'dev.simplesync.shadow.org.apache.commons.io'

    // Exclude duplicate META-INF files
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/maven/**'

    // Exclude all bundled native binaries (downloaded on demand by ZstdNativeLoader to keep mod JAR minimal)
    exclude 'darwin/**'
    exclude 'linux/**'
    exclude 'win/**'
    exclude 'aix/**'
    exclude 'freebsd/**'

    // Exclude unused compression formats and archivers from commons-compress
    exclude '**/archivers/sevenz/**'
    exclude '**/archivers/cpio/**'
    exclude '**/archivers/dump/**'
    exclude '**/archivers/ar/**'
    exclude '**/archivers/arj/**'
    exclude '**/archivers/jar/**'
    exclude '**/archivers/examples/**'
    exclude '**/archivers/ArchiveStreamFactory*'
    exclude '**/archivers/ArchiveStreamProvider*'
    exclude '**/archivers/Lister*'
    exclude '**/archivers/zip/ZipFile*'
    exclude '**/archivers/zip/ZipArchive*'
    exclude '**/archivers/zip/Scatter*'
    exclude '**/archivers/zip/ParallelScatter*'
    exclude '**/archivers/zip/PKWare*'
    exclude '**/archivers/zip/ExtraField*'
    exclude '**/archivers/zip/X*'
    exclude '**/archivers/zip/ZipSplit*'
    exclude '**/archivers/zip/Exploding*'
    exclude '**/archivers/zip/Unshrinking*'
    exclude '**/archivers/zip/AbstractUnicodeExtraField*'
    exclude '**/archivers/zip/AsiExtraField*'
    exclude '**/archivers/zip/ResourceAlignmentExtraField*'
    exclude '**/archivers/zip/UnicodeCommentExtraField*'
    exclude '**/archivers/zip/UnicodePathExtraField*'
    exclude '**/archivers/zip/UnixStat*'
    exclude '**/archivers/zip/UnparseableExtraField*'
    exclude '**/archivers/zip/UnrecognizedExtraField*'
    exclude '**/compressors/**'
    exclude '**/harmony/**'
    exclude '**/changes/**'
    exclude '**/parallel/**'

    // Exclude unused commons-io packages
    exclude '**/commons/io/filefilter/**'
    exclude '**/commons/io/monitor/**'
    exclude '**/commons/io/comparator/**'
    exclude '**/commons/io/serialization/**'
    exclude '**/commons/io/function/**'
    exclude '**/commons/io/build/**'
    exclude '**/commons/io/file/**'
    exclude '**/commons/io/input/**'
}

remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from sourceSets.client.output
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
